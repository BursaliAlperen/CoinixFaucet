<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coinix Market</title><meta name="description" content="Complete verified Telegram and partner offerwall tasks to earn COINIX.">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:32px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;font-size:24px;color:#6d36d8;text-decoration:none}.muted{color:#64748b}.tabs{display:flex;gap:8px;margin:26px 0}.tabs button{border:0;border-radius:12px;padding:11px 16px;background:#6d36d8;color:white;font-weight:700;cursor:pointer}.tabs button[aria-pressed=false]{background:#e8eaf2;color:#334155}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:white;border:1px solid #e5e9f2;border-radius:18px;padding:20px;box-shadow:0 8px 30px #1e293b0a}.tag{font-size:12px;font-weight:700;color:#6d36d8;background:#f1eaff;padding:5px 9px;border-radius:99px}.reward{font-size:22px;font-weight:800;margin:16px 0 6px}.empty{padding:30px;text-align:center;background:white;border-radius:16px;color:#64748b}.notice{padding:14px;border-radius:12px;background:#fff7df;color:#795500;margin:18px 0}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><a class="brand" href="/">COINIX MARKET</a><span class="muted">Earn only after verified tasks</span></header>
<div class="notice">Market preview. Telegram submissions are manually reviewed. Offerwall inventory appears after a provider is configured.</div>
<nav class="tabs" aria-label="Task type"><button type="button" data-type="all" aria-pressed="true">All tasks</button><button type="button" data-type="telegram" aria-pressed="false">Telegram</button><button type="button" data-type="offerwall" aria-pressed="false">Offerwall</button></nav>
<section id="tasks" class="grid" aria-live="polite"><div class="empty">Loading tasks…</div></section>
</main><script>
const root=document.getElementById('tasks');let active='all';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){root.innerHTML='<div class="empty">Loading tasks…</div>';try{const url=active==='all'?'/api/market/tasks':'/api/market/tasks?type='+active;const r=await fetch(url);const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'Could not load tasks');if(!j.tasks.length){root.innerHTML='<div class="empty">No tasks available right now. Please check again later.</div>';return;}root.innerHTML=j.tasks.map(t=>'<article class="card"><span class="tag">'+esc(t.type.toUpperCase())+'</span><h2>'+esc(t.title)+'</h2><p class="muted">'+esc(t.description)+'</p><div class="reward">'+esc(t.reward)+' COINIX</div><small class="muted">'+esc(t.completedCount)+' / '+esc(t.maxParticipants)+' completed</small>'+(t.targetUrl?'<p><a href="'+esc(t.targetUrl)+'" target="_blank" rel="noopener noreferrer">Open Telegram task</a></p>':'')+'</article>').join('');}catch(e){root.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));load();}));load();
</script></body></html>
