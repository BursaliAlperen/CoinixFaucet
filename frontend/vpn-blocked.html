<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 | CoinixFaucet</title>
  <link rel="stylesheet" href="/coinix-design-tokens.css" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cx-bg);color:var(--cx-text);font-family:var(--cx-font-body)}
    main{width:100%;max-width:460px;text-align:center;background:var(--cx-surface);border:1px solid var(--cx-line);border-radius:var(--cx-r-xl);box-shadow:var(--cx-sh-lg);padding:40px 24px}
    .code{margin:0;font:800 clamp(3.5rem,18vw,5.5rem)/1 var(--cx-font-display);color:var(--cx-violet-600);letter-spacing:-.04em}
    h1{margin:12px 0 8px;font:800 1.35rem/1.25 var(--cx-font-display);color:var(--cx-ink)}
    p{margin:0 0 24px;line-height:1.6}
    button{min-height:48px;padding:0 28px;border:0;border-radius:var(--cx-r-md);background:var(--cx-violet-600);color:#fff;font:700 1rem var(--cx-font-display);cursor:pointer}
    button:focus-visible{outline:none;box-shadow:var(--cx-ring)}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1 id="t">VPN or proxy detected</h1>
    <p id="d">Please turn off your VPN or proxy and reload the page to continue.</p>
    <button id="r" type="button">Reload</button>
  </main>
  <script>
    (function () {
      var codes = 'en tr ru es pt fr de it ar hi id vi th zh ja ko pl uk nl fa bn ur'.split(' ');
      var lang = 'en';
      try { lang = localStorage.getItem('cx-lang') || ''; } catch (e) {}
      if (codes.indexOf(lang) < 0) {
        lang = 'en';
        var l = navigator.languages || [navigator.language || 'en'];
        for (var i = 0; i < l.length; i++) { var b = String(l[i]).toLowerCase().split('-')[0]; if (codes.indexOf(b) >= 0) { lang = b; break; } }
      }
      document.documentElement.lang = lang;
      if (lang === 'ar' || lang === 'fa' || lang === 'ur') document.documentElement.dir = 'rtl';
      document.getElementById('r').onclick = function () { location.reload(); };
      if (lang === 'en') return;
      fetch('/locales/' + lang + '.json').then(function (r) { return r.json(); }).then(function (d) {
        if (d['vpn.title']) document.getElementById('t').textContent = d['vpn.title'];
        if (d['vpn.text']) document.getElementById('d').textContent = d['vpn.text'];
        if (d['vpn.retry']) document.getElementById('r').textContent = d['vpn.retry'];
      }).catch(function () {});
    })();
  </script>
</body>
</html>
