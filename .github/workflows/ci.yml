name: CI

on:
  push:
    branches: ["main", "refactor/backend-frontend"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate Firebase configuration JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.database.rules.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
