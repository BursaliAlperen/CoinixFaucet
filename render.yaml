services:
- type: web
  name: coinix-faucet
  env: node
  region: frankfurt
  plan: free
  buildCommand: npm install
  startCommand: node api/index.js
  envVars:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: 10000
  - key: FAUCETPAY_API_KEY
    sync: false
  - key: APP_URL
    value: https://coinixfaucet.mine.bz
  - key: OFFERWALL_APP_ID
    sync: false
  - key: OFFERWALL_SECRET_KEY
    sync: false
  - key: OFFERWALL_API_TOKEN
    sync: false
